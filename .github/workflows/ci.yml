name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # permite executar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # JOB 1 - Build e testes
  # Actions usadas: actions/setup-python  +  actions/upload-artifact
  # ---------------------------------------------------------------
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      # ACTION 1: prepara o ambiente Python (e faz cache das dependências)
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes com cobertura
        run: |
          pytest --cov=app --cov-report=term-missing \
                 --cov-report=xml --cov-report=html \
                 --cov-fail-under=90 \
                 --junitxml=junit.xml

      - name: Resumo de cobertura na página da execução
        if: always()
        run: |
          echo "### Cobertura (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      # ACTION 2: guarda os relatórios para download após a execução
      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 2 - Análise de segurança
  # Action usada: github/codeql-action
  # ---------------------------------------------------------------
  security:
    name: Análise de segurança (CodeQL)
    runs-on: ubuntu-latest
    needs: test              # só roda se os testes passarem
    permissions:
      contents: read
      security-events: write # necessário para enviar os alertas ao GitHub
      actions: read
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      # ACTION 3 (parte 1): inicializa o CodeQL para Python
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      # ACTION 3 (parte 2): executa a análise e publica os resultados
      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
